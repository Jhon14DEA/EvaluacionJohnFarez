server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida cae en index.html para que el router de Angular la resuelva.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy de la API hacia el backend dentro de la red de Docker Compose.
    # El servicio del backend se llama "backend" y escucha en el puerto 8080.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
