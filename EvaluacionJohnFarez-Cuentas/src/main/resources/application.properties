quarkus.devservices.enabled=false
quarkus.datasource.db-kind=mssql
quarkus.datasource.username=${DB_USERNAME:evaluacion_app}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:sqlserver://localhost:${SQLSERVER_PORT:14333};databaseName=${DB_NAME:evaluacion_john_farez};encrypt=true;trustServerCertificate=true
%test.quarkus.datasource.jdbc.url=jdbc:sqlserver://localhost:${SQLSERVER_PORT:14333};databaseName=${TEST_DB_NAME};encrypt=true;trustServerCertificate=true
quarkus.datasource.jdbc.max-size=5
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-disabled=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.sql-load-script=no-file
# El certificado autofirmado se confía solo en este entorno Docker local.

quarkus.rest.exception-mapping.disable-mapper-for=io.quarkus.resteasy.reactive.jackson.runtime.mappers.BuiltinMismatchedInputExceptionMapper

# Documentación disponible para el evaluador local en modo JVM empaquetado.
quarkus.swagger-ui.always-include=true

# OpenAPI se sirve desde el documento estático curado en META-INF/openapi.yaml.
# El escaneo de anotaciones se desactiva para que el archivo estático sea la única fuente de verdad.
mp.openapi.scan.disable=true


# CORS para permitir el consumo desde el frontend Angular (dashboard y formulario).
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,Idempotency-Key
quarkus.http.cors.exposed-headers=Idempotency-Key,X-Total-Count
quarkus.http.cors.access-control-max-age=24H